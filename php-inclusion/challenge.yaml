apiVersion: hg.challenge/v1
kind: Challenge
metadata:
  id: php-inclusion
  title: PHP Local File Inclusion RCE with PHPINFO
  category: web
  description: PHP Local File Inclusion RCE with PHPINFO. Converted from vulhub php/inclusion.
  difficulty: 1
  author: xathrya
  value: 100
  state: hidden
  version: '1'
  source: php/inclusion
spec:
  runtime: container
  spawn: image
  platform:
  - linux/amd64
