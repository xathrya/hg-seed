apiVersion: hg.challenge/v1
kind: Challenge
metadata:
  id: flask-ssti
  title: SSTI Challenge on Flask
  category: web
  description: The name query parameter is concatenated into a Jinja template.
  difficulty: 1
  author: xathrya
  value: 100
  state: hidden
  version: "1"
spec:
  runtime: container
  spawn: image
  platform:
    - linux/amd64
    - linux/arm64
  flags:
    - id: flag
      type: dynamic
      path: /app/flag.txt
      owner: ctf:ctf
      mode: "0400"
      service: web
  scripts:
    test: private/solve.sh
  services:
    - name: web
      build:
        context: services/web
        dockerfile: Dockerfile
        fromDigest: sha256:ae82e9e22e528bbc3c86bd8d34739f74d1a8c59735ac898005c8e6fd8d3d0136
      image:
        name: challenges/web/flask-ssti
      ports:
        - name: http
          container: 5000
          protocol: tcp
          publish: true
      health:
        type: http
        port: 5000
        path: /
      resources:
        memoryMb: 128
        cpuMhz: 200
  networks:
    - name: default
      internal: true
      members:
        - web
  player:
    entry: web.http
    connection: "{url}"
