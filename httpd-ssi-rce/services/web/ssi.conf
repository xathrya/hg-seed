# Load mod_include so `.shtml` files are filtered, and allow the `exec`
# directive. AddOutputFilter comes from mod_filter, which the base apache
# config does not load. Both modules ship in apache2-bin.
# Options +Includes merges with the base Directory block instead of replacing
# ExecCGI. mod_cgi is already loaded, which is what `#exec cmd` needs.
LoadModule filter_module /usr/lib/apache2/modules/mod_filter.so
LoadModule include_module /usr/lib/apache2/modules/mod_include.so

<Directory /app/html>
    Options +Includes
    AddOutputFilter INCLUDES .shtml
</Directory>
