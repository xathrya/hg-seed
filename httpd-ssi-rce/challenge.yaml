apiVersion: hg.challenge/v1
kind: Challenge
metadata:
  id: httpd-ssi-rce
  title: Apache HTTP Server SSI Remote Command Execution
  category: web
  description: Apache HTTP Server SSI Remote Command Execution. Converted from vulhub
    httpd/ssi-rce.
  difficulty: 1
  author: xathrya
  value: 100
  state: hidden
  version: '1'
  source: httpd/ssi-rce
spec:
  runtime: container
  spawn: image
  platform:
  - linux/amd64
  - linux/arm64
  topics:
  - RCE
  - Webserver
  flags:
  - id: flag
    type: dynamic
    path: /app/flag.txt
    owner: ctf:ctf
    mode: '0400'
    service: web
  scripts:
    test: private/solve.sh
  services:
  - name: web
    build:
      context: services/web
      dockerfile: Dockerfile
      fromDigest: sha256:51c70474c54bee1de40fb06811b0c052bd5521aed9a9087f564b42b151718707
    image:
      name: challenges/web/httpd-ssi-rce
    ports:
    - name: http
      container: 80
      protocol: tcp
      publish: true
    health:
      type: http
      port: 80
      path: /
    resources:
      memoryMb: 128
      cpuMhz: 200
  networks:
  - name: default
    internal: true
    members:
    - web
  player:
    entry: web.http
    connection: '{url}'
